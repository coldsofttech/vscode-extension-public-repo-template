name: Bug report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown in the Extensions view, or the release or commit you are using.
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: Run **Help > About**, and note if you use a fork such as VSCodium or Cursor.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Include errors from the **Output** panel or **Help > Toggle Developer Tools**. Remove any secrets or personal information first.
